[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xviral"
version = "0.1.0"
description = "Data pipeline and models for predicting post reach under X's For You algorithm"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "polars>=1.30",
  "pyarrow>=16",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6",
  "requests>=2.31",
  "lingua-language-detector>=2.0",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "pillow>=10",
  "imagehash>=4.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# GPU box only: encoders and transcription.
encoders = [
  "torch>=2.4",
  "transformers>=4.57",
  "sentence-transformers>=5.1",
  "faster-whisper>=1.1",
  "httpx>=0.27",
]
# RQ-KMeans codebook training uses the repo's JAX trainer.
codebook = ["jax>=0.4.30"]
ann = ["faiss-cpu>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
xviral = "xviral.cli:main"

[tool.setuptools.packages.find]
include = ["xviral*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
