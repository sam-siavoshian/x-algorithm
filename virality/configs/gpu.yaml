# Full-scale run on a GPU machine (scripts/gpu_run.sh). Paths are relative to virality/.
paths:
  work: data/work
  community_archive: data/raw/community_archive
  user_scrape: []            # add your scrape JSONL files here, newest first
  analytics: []              # X analytics CSV exports, one per account
  seed_accounts: null        # optional handle list defining the audience
  nitter_2026: data/raw/nitter_2026/data            # 75.8M posts with views, Jan-Jul 2026 (Hugging Face)
  twitter100m_tweets: data/raw/twitter100m/tweets   # tech account timelines to Apr 2023, likes (Hugging Face)
  twitter100m_users: data/raw/twitter100m/users.parquet

workers: 16

community_archive:
  min_created: "2023-01-01"
  requests_per_second: 4

# Accounts are kept or dropped whole (DATA_PIPELINE.md 15.3). Audience accounts are the evaluation and
# product target; general accounts add volume for the trunk, since X ranks everyone with one model.
select:
  min_posts_per_account: 20
  min_tech_share: 0.15
  max_posts_per_account: 600
  general_accounts: 30000
  general_max_posts_per_account: 150

# The per-post topic gate is off: selection is at the account level, and a tech account's off-topic
# posts are part of its history.
relevance:
  enabled: false
  embedder: Qwen/Qwen3-Embedding-0.6B
  topic_margin_min: 0.05

media:
  max_images: 400000
  max_videos: 40000

embed:
  device: cuda
  batch_size: 32
  sid_sample: null
